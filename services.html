*{margin:0;padding:0;box-sizing:border-box;font-family:'Plus Jakarta Sans',sans-serif;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:90px}

.header{position:fixed;top:0;width:100%;height:60px;background:var(--surface);display:flex;align-items:center;padding:0 16px;z-index:100;border-bottom:1px solid #F1F5F9}
.back-btn{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:1.1rem;color:var(--text)}
.header-title{font-weight:700;font-size:1.1rem;margin-left:10px;flex:1}

.tabs{position:fixed;top:60px;width:100%;background:var(--surface);z-index:99;padding:10px 16px;overflow-x:auto;white-space:nowrap;border-bottom:1px solid #F1F5F9;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{display:inline-block;padding:8px 16px;margin-right:8px;border-radius:20px;font-size:.85rem;font-weight:600;background:#F1F5F9;color:var(--text2);border:1px solid transparent;cursor:pointer;transition:.2s}
.tab.active{background:#F0FDFA;color:var(--p);border-color:var(--p)}

.content{margin-top:120px;padding:0 16px}

/* Service Detail Hero */
.srv-hero{background:linear-gradient(135deg,var(--p),var(--p-dark));border-radius:20px;padding:25px 20px;color:#fff;margin-bottom:20px;position:relative;overflow:hidden}
.srv-hero::before{content:'';position:absolute;top:-30px;right:-30px;width:100px;height:100px;background:rgba(255,255,255,.1);border-radius:50%}
.srv-hero h2{font-size:1.3rem;font-weight:800;margin-bottom:8px;position:relative}
.srv-hero p{opacity:.9;font-size:.9rem;position:relative}
.srv-hero .rating{display:flex;align-items:center;gap:6px;margin-top:10px;position:relative}
.srv-hero .rating i{color:#FCD34D;font-size:.9rem}
.srv-hero .rating span{font-size:.85rem;opacity:.9}

/* What's Included */
.inc-card{background:var(--surface);border-radius:16px;padding:20px;margin-bottom:16px;border:1px solid #F1F5F9}
.inc-card h3{font-size:1rem;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.inc-card h3 i{color:var(--p)}
.inc-item{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:.9rem;color:#475569}
.inc-item i{color:var(--ok);font-size:.8rem}

/* Packages */
.pkg-title{font-size:1rem;font-weight:700;margin:20px 0 12px;padding:0 4px}
.pkg-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
.pkg-card{background:var(--surface);border:2px solid #E2E8F0;border-radius:16px;padding:16px 10px;text-align:center;cursor:pointer;transition:.2s;position:relative}
.pkg-card:hover{border-color:var(--p-light)}
.pkg-card.selected{border-color:var(--p);background:#F0FDFA;box-shadow:0 4px 15px rgba(13,148,136,.1)}
.pkg-card .badge{position:absolute;top:-8px;left:50%;transform:translateX(-50%);background:var(--warn);color:#fff;font-size:.65rem;font-weight:700;padding:3px 10px;border-radius:10px}
.pkg-name{font-size:.8rem;font-weight:700;color:var(--text);margin-bottom:6px}
.pkg-price{font-size:1.1rem;font-weight:800;color:var(--p)}
.pkg-old{text-decoration:line-through;color:#94A3B8;font-size:.75rem}
.pkg-list{text-align:left;margin-top:10px;font-size:.75rem;color:var(--text2)}
.pkg-list div{padding:3px 0}
.pkg-list i{color:var(--ok);margin-right:4px;font-size:.7rem}

/* Add-ons */
.addon-card{background:var(--surface);border-radius:16px;padding:16px;margin-bottom:12px;display:flex;align-items:center;gap:14px;border:1px solid #F1F5F9;cursor:pointer;transition:.2s}
.addon-card:hover{border-color:var(--p-light)}
.addon-card.selected{border-color:var(--p);background:#F0FDFA}
.addon-icon{width:44px;height:44px;border-radius:12px;background:#F0FDFA;display:flex;align-items:center;justify-content:center;color:var(--p);font-size:1.1rem;flex-shrink:0}
.addon-info{flex:1}
.addon-info h4{font-size:.9rem;font-weight:700;margin-bottom:2px}
.addon-info p{font-size:.8rem;color:var(--text2)}
.addon-price{font-weight:800;color:var(--p);font-size:.95rem}
.addon-check{width:24px;height:24px;border:2px solid #CBD5E1;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#fff;transition:.2s;flex-shrink:0}
.addon-card.selected .addon-check{background:var(--p);border-color:var(--p)}

/* Calculator (for painting) */
.calc-card{background:var(--surface);border-radius:16px;padding:20px;margin-bottom:16px;border:1px solid #F1F5F9}
.calc-row{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px dashed #E2E8F0;cursor:pointer}
.calc-row:last-child{border-bottom:none}
.calc-label{font-size:.9rem;color:var(--text2);font-weight:600}
.calc-val{font-size:.95rem;font-weight:700;color:var(--p);display:flex;align-items:center;gap:6px}
.calc-total{background:linear-gradient(135deg,#F0FDFA,#CCFBF1);padding:20px;border-radius:14px;text-align:center;margin-top:16px;border:1px solid #CCFBF1}
.calc-total .label{font-size:.85rem;color:var(--text2);margin-bottom:4px}
.calc-total .price{font-size:2rem;font-weight:800;color:var(--p)}

/* Cart Bar */
.cart-bar{position:fixed;bottom:75px;left:12px;right:12px;background:#1E293B;color:#fff;padding:14px 18px;border-radius:14px;display:none;align-items:center;justify-content:space-between;z-index:200;box-shadow:0 10px 30px rgba(0,0,0,.2)}

.cart-info{font-size:.8rem;opacity:.8}
.cart-price{font-weight:800;font-size:1.1rem}
.cart-btn{background:var(--p);color:#fff;border:none;padding:10px 20px;border-radius:10px;font-weight:700;font-size:.9rem;cursor:pointer}

/* Bottom Sheet */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);z-index:99990;display:none;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .3s}
.overlay.active{display:flex;opacity:1}
.sheet{background:#fff;width:100%;max-width:480px;border-radius:24px 24px 0 0;transform:translateY(100%);transition:transform .35s cubic-bezier(.32,.72,0,1);max-height:85vh;overflow:hidden;display:flex;flex-direction:column}
.overlay.active .sheet{transform:translateY(0)}
.sheet-drag{width:40px;height:4px;background:#E2E8F0;border-radius:2px;margin:12px auto}
.shead{padding:0 20px 16px;display:flex;align-items:center;justify-content:space-between}
.shead h3{font-size:1.1rem;font-weight:700}
.sclose{width:32px;height:32px;border-radius:50%;background:#F1F5F9;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer}
.sbody{padding:0 20px 20px;overflow-y:auto;flex:1}
.sel-opt{padding:16px;border-bottom:1px solid #F1F5F9;display:flex;justify-content:space-between;align-items:center;font-weight:600;cursor:pointer;border-radius:12px;margin-bottom:6px;transition:.2s}

.menu-info p{font-size:.8rem;color:var(--text2)}

.menu-qty span{font-weight:700;min-width:20px;text-align:center}
.add-btn{padding:8px 18px;background:var(--p);color:#fff;border:none;border-radius:10px;font-weight:700;font-size:.85rem;cursor:pointer}

/* Toast */
.toast-wrap{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:100000;display:flex;flex-direction:column;gap:8px;pointer-events:none;width:92%;max-width:380px}
.toast{background:#fff;padding:14px 16px;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.15);display:flex;align-items:center;gap:12px;transform:translateY(-80px);opacity:0;transition:all .4s cubic-bezier(.32,.72,0,1);pointer-events:all;border-left:4px solid var(--p)}
.toast.show{transform:translateY(0);opacity:1}
.toast.ok{border-left-color:var(--ok)}.toast.err{border-left-color:var(--err)}.toast.warn{border-left-color:var(--warn)}
.toast-ico{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:.9rem;flex-shrink:0}
.toast.ok .toast-ico{background:#DCFCE7;color:var(--ok)}.toast.err .toast-ico{background:#FEE2E2;color:var(--err)}.toast.warn .toast-ico{background:#FEF3C7;color:var(--warn)}.toast.inf .toast-ico{background:#F0FDFA;color:var(--p)}
.toast-tit{font-weight:700;color:#1E293B;font-size:.9rem}.toast-msg{color:var(--text2);font-size:.8rem}

/* Nav */
.nav{position:fixed;bottom:0;width:100%;height:68px;background:var(--surface);border-top:1px solid #F1F5F9;display:flex;justify-content:space-around;align-items:center;z-index:100}
.nav-item{text-align:center;color:#94A3B8;font-size:.65rem;font-weight:700;width:60px;cursor:pointer;padding:6px;border-radius:12px;transition:.2s;border:none;background:none}
.nav-item.active{color:var(--p);background:#F0FDFA}
.nav-item i{display:block;font-size:1.2rem;margin-bottom:3px}

@media(min-width:480px){body{max-width:480px;margin:0 auto}.header,.nav{max-width:480px;left:50%;transform:translateX(-50%)}}
</style>
</head>

ads.forEach((a,i)=>{
const sel=state.addons.includes(i);
html+=`<div class="addon-card ${sel?'selected':''}" onclick="toggleAddon(${i})"><div class="addon-icon"><i class="fa-solid ${a.icon}"></i></div><div class="addon-info"><h4>${a.name}</h4><p>${a.desc}</p></div><div style="text-align:right"><div class="addon-price">+Rs ${a.price}</div><div class="addon-check"><i class="fa-solid fa-check" style="font-size:.7rem;opacity:${sel?1:0}"></i></div></div></div>`;
});
}

if(isPaint){
html+=`<div class="calc-card"><h3 style="margin-bottom:16px;font-size:1rem"><i class="fa-solid fa-calculator" style="color:var(--p);margin-right:8px"></i>Paint Calculator</h3>`;
html+=renderRow('city','City',state.paint.city.toUpperCase());
html+=renderRow('room','Area',state.paint.roomTxt);
html+=renderRow('svc','Condition',state.paint.svcTxt);
html+=renderRow('brand','Brand',state.paint.brand);
html+=renderRow('pcat','Type',state.paint.cat);
html+=renderRow('prod','Product',state.paint.prodName);
html+=`<div style="display:flex;justify-content:space-between;align-items:center;padding:14px 0"><span class="calc-label">Quantity</span><div style="display:flex;align-items:center;gap:10px;background:#F1F5F9;border-radius:10px;padding:4px"><button onclick="chgQty(-1)" style="width:32px;height:32px;border:none;background:transparent;font-size:1.2rem;color:var(--p);cursor:pointer">-</button><span style="font-weight:700;min-width:20px;text-align:center">${state.paint.qty}</span><button onclick="chgQty(1)" style="width:32px;height:32px;border:none;background:transparent;font-size:1.2rem;color:var(--p);cursor:pointer">+</button></div></div>`;
html+=`<div class="calc-total"><div class="label">Estimated Cost</div><div class="price" id="calcTotal">Rs ${calcTotal().toLocaleString()}</div></div>`;
html+=`</div>`;
}

html+=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:20px 0 30px">
<button style="padding:14px;border:2px solid var(--p);background:#fff;color:var(--p);border-radius:12px;font-weight:700;cursor:pointer;font-size:.9rem" onclick="bookVisit()">Book Visit @ Rs 49</button>
<button style="padding:14px;border:none;background:linear-gradient(135deg,var(--p),var(--p-light));color:#fff;border-radius:12px;font-weight:700;cursor:pointer;font-size:.9rem;box-shadow:0 4px 15px rgba(13,148,136,.3)" onclick="bookNow()">Book Now</button>
</div>`;

el.innerHTML=html;
}

function renderMenu(el,cat){
const items=menuData[cat]||[];
if(items.length===0){el.innerHTML='<div style="text-align:center;padding:60px;color:#94A3B8"><i class="fa-solid fa-box-open" style="font-size:3rem;margin-bottom:15px"></i><p>Coming Soon</p></div>';return;}

let html=`<div class="srv-hero"><h2>${cat.charAt(0).toUpperCase()+cat.slice(1)} Services</h2><p>Expert professionals at your service</p><div class="rating"><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><span>4.9 (1,800+ reviews)</span></div></div>`;

html+=`<div class="inc-card"><h3><i class="fa-solid fa-circle-check"></i>What's Included</h3><div class="inc-item"><i class="fa-solid fa-check"></i>Verified professional partner</div><div class="inc-item"><i class="fa-solid fa-check"></i>Genuine spare parts</div><div class="inc-item"><i class="fa-solid fa-check"></i>30-day service warranty</div><div class="inc-item"><i class="fa-solid fa-check"></i>Post-service cleanup</div></div>`;

items.forEach(item=>{
const q=state.cart[item.name]?.qty||0;
html+=`<div class="menu-card"><div class="menu-info"><h4>${item.name}</h4><p>${item.unit||'Per Service'}</p>${q>0?`<div class="menu-qty"><button onclick="updateCart('${item.name}',${item.price},-1)">-</button><span>${q}</span><button onclick="updateCart('${item.name}',${item.price},1)">+</button></div>`:`<button class="add-btn" style="margin-top:8px" onclick="updateCart('${item.name}',${item.price},1)">ADD +</button>`}</div><div class="menu-price">Rs ${item.price}</div></div>`;
});

el.innerHTML=html;
updateCartBar();
}

function renderRow(type,label,val){
return `<div class="calc-row" onclick="openSel('${type}')"><span class="calc-label">${label}</span><span class="calc-val">${val} <i class="fa-solid fa-chevron-right" style="font-size:.7rem;color:#94A3B8"></i></span></div>`;
}

function openSel(type){
selCtx=type;
document.getElementById('selOverlay').classList.add('active');
const body=document.getElementById('selBody');
let opts=[],title='Select';
if(type==='city'){title='Select City';opts=paintData.cities;}
else if(type==='room'){title='Select Area';opts=paintData.rooms;}
else if(type==='svc'){title='Select Condition';opts=paintData.services;}
else if(type==='brand'){title='Select Brand';opts=paintData.brands;}
else if(type==='pcat'){title='Select Type';opts=Object.keys(paintData.catalog[state.paint.brand]).map(c=>({v:c,t:c}));}
else if(type==='prod'){title='Select Product';opts=paintData.catalog[state.paint.brand][state.paint.cat].map(p=>({v:p.p,t:`${p.n} (Rs ${p.p}/sqft)`}));}

document.getElementById('selTitle').textContent=title;
body.innerHTML=opts.map(o=>`<div class="sel-opt ${getSelVal(type)==o.v?'sel':''}" onclick="handleSel('${type}','${o.v}','${o.t}')"><span>${o.t}</span>${getSelVal(type)==o.v?'<i class="fa-solid fa-check" style="color:var(--p)"></i>':''}</div>`).join('');
}

function getSelVal(type){
if(type==='city')return state.paint.city;
if(type==='room')return state.paint.room;
if(type==='svc')return state.paint.svc;
if(type==='brand')return state.paint.brand;
if(type==='pcat')return state.paint.cat;
if(type==='prod')return state.paint.prod;
return '';
}

function handleSel(type,val,text){
if(type==='city')state.paint.city=val;
if(type==='room'){state.paint.room=parseInt(val);state.paint.roomTxt=text.split('(')[0].trim();}
if(type==='svc'){state.paint.svc=parseInt(val);state.paint.svcTxt=text.split('(')[0].trim();}
if(type==='brand'){state.paint.brand=val;state.paint.cat=Object.keys(paintData.catalog[val])[0];const p=paintData.catalog[val][state.paint.cat][0];state.paint.prod=p.p;state.paint.prodName=p.n;}
if(type==='pcat'){state.paint.cat=val;const p=paintData.catalog[state.paint.brand][val][0];state.paint.prod=p.p;state.paint.prodName=p.n;}
if(type==='prod'){state.paint.prod=parseInt(val);state.paint.prodName=text.split('(')[0].trim();}
closeSel();
renderPaint(document.getElementById('mainContent'),state.cat);
}

function closeSel(){document.getElementById('selOverlay').classList.remove('active');}

function chgQty(d){if(state.paint.qty+d>0){state.paint.qty+=d;document.getElementById('calcTotal').textContent='Rs '+calcTotal().toLocaleString();}}

function calcTotal(){
const base=(state.paint.prod+state.paint.svc+(state.pkg!==''?(packages[state.cat]||packages.painting)[state.pkg].price:0));
let addonTotal=0;
const ads=addons[state.cat]||[];
state.addons.forEach(i=>{if(ads[i])addonTotal+=ads[i].price;});
return Math.round((base+addonTotal)*state.paint.room*state.paint.qty);
}

function selectPkg(i){state.pkg=i;renderPaint(document.getElementById('mainContent'),state.cat);}
function toggleAddon(i){const idx=state.addons.indexOf(i);if(idx>-1)state.addons.splice(idx,1);else state.addons.push(i);renderPaint(document.getElementById('mainContent'),state.cat);}

function updateCart(name,price,chg){
if(!state.cart[name])state.cart[name]={price,qty:0};
state.cart[name].qty+=chg;
if(state.cart[name].qty<=0)delete state.cart[name];
if(state.cat==='painting'||state.cat==='waterproofing'){}
else{renderMenu(document.getElementById('mainContent'),state.cat);}
updateCartBar();
}

function updateCartBar(){
const items=Object.values(state.cart);
const count=items.reduce((s,i)=>s+i.qty,0);
const total=items.reduce((s,i)=>s+(i.price*i.qty),0);
const bar=document.getElementById('cartBar');
if(count>0){bar.classList.add('active');document.getElementById('cartInfo').textContent=count+' item'+(count>1?'s':'');document.getElementById('cartPrice').textContent='Rs '+total.toLocaleString();}
else{bar.classList.remove('active');}
}

function bookVisit(){
const order={service:state.cat==='painting'?'Painting Site Visit':'Waterproofing Consultation',total:49,type:'visit',details:[{name:'Site Visit',price:49,qty:1}],date:new Date().toLocaleDateString()};
localStorage.setItem('pendingOrder',JSON.stringify(order));
window.location.href='checkout.html';
}

function bookNow(){
const total=calcTotal();
const ads=addons[state.cat]||[];
const adNames=state.addons.map(i=>ads[i]?.name).filter(Boolean);
const pkgName=state.pkg!==''?(packages[state.cat]||packages.painting)[state.pkg]?.name:'';

const details=[{name:'Service Type',price:state.paint.svcTxt,qty:1},{name:'Area',price:state.paint.roomTxt,qty:1},{name:'Product',price:state.paint.prodName,qty:1}];
if(pkgName)details.push({name:pkgName+' Package',price:(packages[state.cat]||packages.painting)[state.pkg].price,qty:1});
state.addons.forEach(i=>{if(ads[i])details.push({name:ads[i].name,price:ads[i].price,qty:1});});

const order={service:(state.cat==='painting'?'Home Painting':'Waterproofing')+(pkgName?' - '+pkgName:''),total:total,type:'project',details:details,date:new Date().toLocaleDateString()};
localStorage.setItem('pendingOrder',JSON.stringify(order));
window.location.href='checkout.html';
}

function goCheckout(){
const items=Object.entries(state.cart).map(([n,d])=>({name:n,...d}));
if(items.length===0)return;
const total=items.reduce((s,i)=>s+(i.price*i.qty),0);
const order={service:items[0].name+(items.length>1?' + '+(items.length-1)+' more':''),total:total,type:'service',details:items,date:new Date().toLocaleDateString()};
localStorage.setItem('pendingOrder',JSON.stringify(order));
window.location.href='checkout.html';
}

function goTo(url){window.location.href=url;}

function toast(msg,type='inf',title=''){const w=document.getElementById('toastWrap');const t=document.createElement('div');t.className='toast '+type;const icons={ok:'fa-circle-check',err:'fa-circle-xmark',warn:'fa-triangle-exclamation',inf:'fa-circle-info'};const titles={ok:'Success!',err:'Error!',warn:'Warning!',inf:'Information'};t.innerHTML=`<div class="toast-ico"><i class="fa-solid ${icons[type]}"></i></div><div><div class="toast-tit">${title||titles[type]}</div><div class="toast-msg">${msg}</div></div>`;w.appendChild(t);setTimeout(()=>t.classList.add('show'),10);setTimeout(()=>{t.classList.remove('show');setTimeout(()=>t.remove(),400);},4000);}
</script>
</body>
</html>
